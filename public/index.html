```html
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="theme-color" content="#09090b" />
	<title>Him 🖤</title>

	<style>
		:root {
			--bg: #09090b;
			--surface: #111114;
			--surface-2: #18181c;
			--user-bg: #242429;
			--him-bg: #151518;
			--border: #29292f;
			--text: #f4f4f5;
			--muted: #8b8b95;
			--accent: #8f1d2c;
			--accent-hover: #a92335;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			height: 100%;
		}

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Helvetica,
				Arial,
				sans-serif;
			background: var(--bg);
			color: var(--text);
			overflow: hidden;
		}

		.app {
			height: 100dvh;
			max-width: 900px;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
		}

		header {
			flex-shrink: 0;
			padding: 20px 16px 15px;
			text-align: center;
			border-bottom: 1px solid var(--border);
			background: rgba(9, 9, 11, 0.94);
		}

		.heart {
			font-size: 1.3rem;
			margin-bottom: 3px;
		}

		h1 {
			font-size: 1.35rem;
			font-weight: 650;
		}

		.status {
			margin-top: 4px;
			font-size: 0.78rem;
			color: var(--muted);
		}

		.status::before {
			content: "●";
			color: #6f8f73;
			margin-right: 5px;
			font-size: 0.6rem;
		}

		.chat-container {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 24px 16px 30px;
		}

		.message {
			width: fit-content;
			max-width: min(78%, 620px);
			margin-bottom: 14px;
			padding: 11px 14px;
			border-radius: 17px;
		}

		.message p {
			white-space: pre-line;
			margin: 0;
			overflow-wrap: anywhere;
			font-size: 0.95rem;
			line-height: 1.55;
		}

		.assistant-message {
			background: var(--him-bg);
			border: 1px solid var(--border);
			border-bottom-left-radius: 5px;
			margin-right: auto;
		}

		.user-message {
			background: var(--user-bg);
			border: 1px solid #303037;
			border-bottom-right-radius: 5px;
			margin-left: auto;
		}

		.typing-indicator {
			display: none;
			flex-shrink: 0;
			padding: 0 18px 9px;
			color: var(--muted);
			font-size: 0.8rem;
		}

		.typing-indicator.visible {
			display: block;
		}

		.message-input {
			flex-shrink: 0;
			display: flex;
			gap: 9px;
			padding: 12px 12px;
			padding-bottom: max(12px, env(safe-area-inset-bottom));
			border-top: 1px solid var(--border);
			background: rgba(9, 9, 11, 0.96);
		}

		#user-input {
			flex: 1;
			min-width: 0;
			min-height: 46px;
			max-height: 140px;
			padding: 12px 14px;
			border: 1px solid var(--border);
			border-radius: 15px;
			outline: none;
			background: var(--surface);
			color: var(--text);
			font-family: inherit;
			font-size: 16px;
			resize: none;
		}

		#user-input::placeholder {
			color: #66666f;
		}

		#user-input:focus {
			border-color: #45454d;
			background: var(--surface-2);
		}

		#send-button {
			align-self: flex-end;
			min-width: 58px;
			height: 46px;
			padding: 0 16px;
			border: none;
			border-radius: 14px;
			background: var(--accent);
			color: white;
			font-family: inherit;
			font-size: 0.9rem;
			font-weight: 600;
			cursor: pointer;
		}

		#send-button:hover {
			background: var(--accent-hover);
		}

		#send-button:disabled {
			background: #34343a;
			color: #777780;
			cursor: not-allowed;
		}

		footer {
			display: none;
		}

		@media (max-width: 600px) {
			.message {
				max-width: 86%;
			}
		}
	</style>
</head>

<body>
	<div class="app">

		<header>
			<div class="heart">🖤</div>
			<h1>Him</h1>
			<div class="status">online</div>
		</header>

		<div class="chat-container">

			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>I'm here.</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				Him is thinking...
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Say something..."
					rows="1"
					autofocus
				></textarea>

				<button id="send-button">Send</button>
			</div>

		</div>

	</div>

	<script src="chat.js"></script>
</body>
</html>
```
