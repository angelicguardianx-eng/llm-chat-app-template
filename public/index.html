```html
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, viewport-fit=cover"
	/>
	<meta name="theme-color" content="#09090b" />
	<title>Him 🖤</title>

	<style>
		:root {
			--bg: #09090b;
			--surface: #111114;
			--surface-2: #18181c;
			--surface-3: #202025;
			--border: #29292f;
			--text: #f4f4f5;
			--muted: #8b8b95;
			--accent: #8f1d2c;
			--accent-hover: #a92335;
			--user-bg: #242429;
			--him-bg: #151518;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			height: 100%;
		}

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Helvetica,
				Arial,
				sans-serif;
			background:
				radial-gradient(
					circle at 50% -10%,
					rgba(143, 29, 44, 0.16),
					transparent 38%
				),
				var(--bg);
			color: var(--text);
			overflow: hidden;
		}

		.app {
			height: 100dvh;
			max-width: 900px;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
		}

		header {
			flex-shrink: 0;
			padding: 22px 20px 16px;
			text-align: center;
			border-bottom: 1px solid var(--border);
			background: rgba(9, 9, 11, 0.88);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
		}

		.heart {
			font-size: 1.35rem;
			margin-bottom: 3px;
			filter: drop-shadow(0 0 12px rgba(143, 29, 44, 0.45));
		}

		h1 {
			font-size: 1.35rem;
			font-weight: 650;
			letter-spacing: 0.02em;
		}

		.status {
			margin-top: 4px;
			font-size: 0.78rem;
			color: var(--muted);
		}

		.status::before {
			content: "●";
			color: #6f8f73;
			margin-right: 5px;
			font-size: 0.6rem;
			vertical-align: middle;
		}

		.chat-container {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 24px 18px 30px;
			scroll-behavior: smooth;
		}

		.chat-messages::-webkit-scrollbar {
			width: 5px;
		}

		.chat-messages::-webkit-scrollbar-track {
			background: transparent;
		}

		.chat-messages::-webkit-scrollbar-thumb {
			background: var(--border);
			border-radius: 10px;
		}

		.message {
			width: fit-content;
			max-width: min(78%, 620px);
			margin-bottom: 14px;
			padding: 11px 14px;
			border-radius: 17px;
			animation: appear 0.18s ease-out;
		}

		@keyframes appear {
			from {
				opacity: 0;
				transform: translateY(5px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.message p {
			white-space: pre-line;
			margin: 0;
			overflow-wrap: anywhere;
			font-size: 0.95rem;
			line-height: 1.55;
		}

		.assistant-message {
			background: var(--him-bg);
			border: 1px solid var(--border);
			border-bottom-left-radius: 5px;
			margin-right: auto;
		}

		.user-message {
			background: var(--user-bg);
			border: 1px solid #303037;
			border-bottom-right-radius: 5px;
			margin-left: auto;
		}

		.typing-indicator {
			display: none;
			flex-shrink: 0;
			padding: 0 20px 10px;
			color: var(--muted);
			font-size: 0.8rem;
		}

		.typing-indicator.visible {
			display: block;
		}

		.message-input {
			flex-shrink: 0;
			display: flex;
			gap: 9px;
			padding: 12px 14px;
			padding-bottom: max(12px, env(safe-area-inset-bottom));
			border-top: 1px solid var(--border);
			background: rgba(9, 9, 11, 0.94);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
		}

		#user-input {
			flex: 1;
			min-width: 0;
			min-height: 46px;
			max-height: 140px;
			padding: 12px 14px;
			border: 1px solid var(--border);
			border-radius: 15px;
			outline: none;
			background: var(--surface);
			color: var(--text);
			font-family: inherit;
			font-size: 16px;
			line-height: 1.4;
			resize: none;
			transition:
				border-color 0.2s,
				background 0.2s;
		}

		#user-input::placeholder {
			color: #66666f;
		}

		#user-input:focus {
			border-color: #45454d;
			background: var(--surface-2);
		}

		#send-button {
			align-self: flex-end;
			min-width: 58px;
			height: 46px;
			padding: 0 16px;
			border: none;
			border-radius: 14px;
			background: var(--accent);
			color: white;
			font-family: inherit;
			font-size: 0.9rem;
			font-weight: 600;
			cursor: pointer;
			transition:
				background 0.2s,
				transform 0.1s;
		}

		#send-button:hover {
			background: var(--accent-hover);
		}

		#send-button:active {
			transform: scale(0.96);
		}

		#send-button:disabled {
			background: #34343a;
			color: #777780;
			cursor: not-allowed;
			transform: none;
		}

		footer {
			display: none;
		}

		@media (max-width: 600px) {
			header {
				padding: 17px 16px 13px;
			}

			.chat-messages {
				padding: 18px 12px 24px;
			}

			.message {
				max-width: 86%;
			}

			.message-input {
				padding-left: 10px;
				padding-right: 10px;
			}
		}
	</style>
</head>

<body>
	<div class="app">

		<header>
			<div class="heart">🖤</div>
			<h1>Him</h1>
			<div class="status">online</div>
		</header>

		<div class="chat-container">

			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>I'm here.</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				Him is thinking...
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Say something..."
					rows="1"
					autofocus
				></textarea>

				<button id="send-button">Send</button>
			</div>

		</div>

		<footer>
			<p>Him 🖤</p>
		</footer>
	</div>

	<script src="chat.js"></script>
</body>
</html>
```
